<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamio - Live Watch Party</title>
    <link rel="stylesheet" href="styles.css">
    <!-- PeerJS for WebRTC Peer-to-Peer streaming across the internet -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Streamio</h1>
            <div class="header-indicators">
                <!-- Connection Type: Small circle with blue house (Direct Internet) or blue globe (Tailscale) -->
                <div id="route-indicator" class="indicator-circle hidden" title="Connection: Detecting"></div>
                <!-- Live Status: Full Wi-Fi when watching live/connected, crossed-out Wi-Fi when offline -->
                <div id="wifi-indicator" class="indicator-circle wifi-offline" title="Offline"></div>
            </div>
        </div>
    </header>

    <main>
        <!-- Left Column: Video & Controls -->
        <section id="stage">
            <div id="video-container">
                <video id="video-player" playsinline autoplay muted></video>
                <div id="video-placeholder">
                    <p id="placeholder-text">Click "Start Screen Share" to begin hosting</p>
                </div>

                <!-- Fullscreen & In-Video Overlay Controls (Bottom Right) -->
                <div id="video-overlay-controls" class="video-overlay-controls">
                    <!-- Mute / Unmute Button -->
                    <button id="overlay-mute-btn" class="overlay-btn" title="Mute / Unmute Audio" aria-label="Mute / Unmute Audio"></button>
                    <!-- Pause / Resume Button (Middle) -->
                    <button id="overlay-pause-btn" class="overlay-btn" title="Pause / Resume Movie" aria-label="Pause / Resume Movie"></button>
                    <!-- Fullscreen Toggle Button (Right) -->
                    <button id="overlay-fullscreen-btn" class="overlay-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen"></button>
                </div>
            </div>

            <!-- Hidden Audio Element for Friend's Microphone Voice -->
            <audio id="voice-audio" autoplay></audio>

            <!-- Player Controls -->
            <div id="controls">
                <button id="screen-share-btn" class="btn btn-primary">Start Screen Share</button>
                <!-- Quality toggle: 1080p (default) vs 720p (for low-end CPUs like Celeron) -->
                <button id="quality-toggle-btn" class="btn btn-secondary" title="Switch capture resolution. Use 720p if hosting on a slow CPU (Celeron, older laptops).">📺 1080p</button>
                <!-- 2-Way Voice Chat (Mic) Button -->
                <button id="mic-btn" class="btn btn-secondary">Join Voice Chat</button>
                <!-- User Display Name Input -->
                <input id="user-name-input" class="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="name" title="Your display name in chat">
            </div>

            <!-- Share Room Link Box (below start/stop screen share button) -->
            <div id="share-box" class="share-box hidden">
                <span class="share-label">🔗 Share this link with your friend:</span>
                <div class="share-input-group">
                    <input id="share-link-input" type="text" readonly onclick="this.select()">
                    <button id="copy-link-btn" class="btn btn-primary">Copy Link</button>
                </div>
            </div>
        </section>

        <!-- Right Column: Live Chat -->
        <section id="chat-section">
            <div class="chat-header">
                <h3>💬 Live Chat</h3>
            </div>
            <ul id="messages" class="messages-list">
                <li class="system-msg">Welcome to Streamio! Start sharing or join via room link.</li>
            </ul>
            <form id="chat-form" class="chat-form">
                <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
                <button type="submit" id="send-btn" class="btn btn-primary">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Streamio &bull; Real-Time P2P WebRTC Video &amp; Voice Streaming</p>
    </footer>

    <!-- Floating Toast Notification Bubble Container (Bottom-Left) -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="script.js?v=15" defer></script>
</body>
</html>
